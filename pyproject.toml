[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xgb-return-ranking"
version = "0.1.0"
description = "XGBoost return ranking versus traditional factors for adaptive multi-asset portfolios."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Hossein Tabasi" }]
requires-python = ">=3.11"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "pyyaml>=6.0",
  "joblib>=1.3",
  "yfinance>=0.2",
  "xgboost>=2.0",
  "pyarrow>=14",
]

[project.optional-dependencies]
shap = ["shap>=0.44"]
dev = [
  "pytest>=7.4",
  "ruff>=0.5",
]
full = ["xgb-return-ranking[shap,dev]"]

[project.scripts]
xgb-rank-run = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
src = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
